<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Orden - Gestion de Mantenimiento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=2.0">
  <link rel="stylesheet" href="css/layout.css?v=2.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="https://res.cloudinary.com/ztbcsp9h/image/upload/gpanel-web/gpanel-icon.ico">
</head>

<body>
  <div class="bg-decoration" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <div class="app-container" id="appContainer">
    <div class="main-content">
      <div class="page-header">
        <div>
          <h1>Nueva Orden de Servicio</h1>
          <p class="page-subtitle">Cuéntanos qué necesitas y un técnico será asignado a tu orden</p>
        </div>
        <button class="sidebar-theme-btn" data-theme-toggle aria-label="Cambiar a modo oscuro" title="Modo oscuro">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>

      <div class="detail-card" data-reveal style="border-radius:var(--radius); padding:28px; max-width:640px;">
        <div class="alert alert-error" id="errorAlert"></div>
        <div class="alert alert-success" id="successAlert"></div>

        <form id="newOrderForm">
          <div class="form-group">
            <label for="deviceType">Tipo de dispositivo</label>
            <select id="deviceType" required>
              <option value="">-- Selecciona un dispositivo --</option>
              <option value="PC de Escritorio">PC de Escritorio</option>
              <option value="Portatil">Portatil</option>
              <option value="Celular">Celular</option>
              <option value="Impresora">Impresora</option>
              <option value="Tablet">Tablet</option>
              <option value="Monitor">Monitor</option>
              <option value="Teclado">Teclado</option>
              <option value="Mouse">Mouse</option>
              <option value="Parlantes">Parlantes</option>
              <option value="Scanneer">Scanneer</option>
              <option value="Router">Router</option>
              <option value="Servidor">Servidor</option>
              <option value="Otro">Otro</option>
            </select>
          </div>

          <div class="form-group">
            <label for="description">Descripcion del problema o servicio</label>
            <textarea id="description" name="description" required minlength="10"
              placeholder="Ej: La impresora HP del area de recepcion no imprime, muestra error de atasco de papel."></textarea>
            <span class="form-hint">Se lo mas especifico posible: equipo, marca, y que esta fallando.</span>
          </div>

          <div class="form-group">
            <label>Imagenes adjuntas <span style="font-weight:400;color:var(--ink-mute)">(opcional)</span></label>
            <div class="image-dropzone" id="imageDropzone">
              <i class="fa-solid fa-cloud-arrow-up dropzone-icon"></i>
              <p class="dropzone-text">Arrastra imagenes aqui o <span class="dropzone-link">selecciona archivos</span></p>
              <p class="dropzone-hint">JPG, PNG, WEBP - Maximo 5MB por archivo</p>
              <input type="file" id="imageInput" accept="image/*" multiple style="display:none">
            </div>
            <div class="image-preview-grid" id="imagePreviewGrid"></div>
          </div>

          <button type="submit" class="btn btn-secondary" id="submitBtn">
            <i class="fa-solid fa-paper-plane"></i> Generar Orden
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=2.0"></script>
  <script src="js/auth.js?v=2.0"></script>
  <script src="js/theme.js?v=2.0"></script>
  <script src="js/sidebar.js?v=2.0"></script>
  <script src="js/order-new.js?v=2.0"></script>
  <script src="js/effects.js?v=2.0"></script>
  <script src="js/footer.js?v=2.0"></script>
</body>

</html>

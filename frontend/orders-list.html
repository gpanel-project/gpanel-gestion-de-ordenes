<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordenes - Gestion de Mantenimiento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=2.0">
  <link rel="stylesheet" href="css/layout.css?v=2.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="bg-decoration" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <div class="app-container" id="appContainer">
    <div class="main-content">
      <div class="page-header">
        <h1>Ordenes de Servicio</h1>
        <button class="sidebar-theme-btn" data-theme-toggle aria-label="Cambiar a modo oscuro" title="Modo oscuro">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
      <div class="form-group" style="max-width:300px">
        <label for="filterStatus">Filtrar por estado</label>
        <select id="filterStatus">
          <option value="">Todos</option>
          <option value="pendiente">Pendiente</option>
          <option value="en_progreso">En progreso</option>
          <option value="atendida">Atendida</option>
          <option value="completada">Completada</option>
          <option value="cancelada">Cancelada</option>
        </select>
      </div>
      <div class="table-container" data-reveal>
        <table>
          <thead>
            <tr>
              <th>Orden</th>
              <th>Cliente</th>
              <th>Tecnico</th>
              <th>Descripcion</th>
              <th>Estado</th>
              <th>Costo</th>
              <th>Fecha</th>
              <th>Accion</th>
            </tr>
          </thead>
          <tbody id="ordersTable"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="js/api.js?v=2.0"></script>
  <script src="js/auth.js?v=2.0"></script>
  <script src="js/theme.js?v=2.0"></script>
  <script src="js/sidebar.js?v=2.0"></script>
  <script src="js/orders-list.js?v=2.0"></script>
  <script src="js/effects.js?v=2.0"></script>
  <script src="js/footer.js?v=2.0"></script>
</body>
</html>

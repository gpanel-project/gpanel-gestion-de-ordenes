<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios - Gestion de Mantenimiento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="bg-decoration" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="speck speck-1"></div>
    
    <div class="speck speck-4"></div>
  </div>

  <div class="app-container" id="appContainer">
    <div class="main-content">
      <div class="page-header">
        <div>
          <h1>Gestión de Usuarios</h1>
          <p class="page-subtitle">Administra los técnicos y clientes del sistema</p>
        </div>
        
        <button class="sidebar-theme-btn" data-theme-toggle aria-label="Cambiar a modo oscuro" title="Modo oscuro">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>

      <div id="alertBox" class="alert"></div>

      <div class="stats-grid" id="userStatsGrid" data-reveal></div>
      
      <button class="btn btn-secondary btn-create" onclick="openCreateModal()">
          <i class="fa-solid fa-plus"></i> Nuevo usuario Técnico
        </button>

      <div class="table-container" data-reveal>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Rol</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ── Modal: Crear / Editar Técnico ────────────────────── -->
  <div id="userModal" class="modal-overlay" style="display:none">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">Nuevo Técnico</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="userForm">
        <div class="form-group">
          <label for="userName">Nombre completo</label>
          <input type="text" id="userName" required>
        </div>
        <div class="form-group">
          <label for="userEmail">Correo electrónico</label>
          <input type="email" id="userEmail" required>
        </div>
        <div id="passwordGroup" class="form-group">
          <label for="userPassword">Contraseña</label>
          <input type="password" id="userPassword" minlength="6">
          <span class="form-hint">Mínimo 6 caracteres. Deja vacío para mantener la actual.</span>
        </div>
        <div class="form-group">
          <label for="userRole">Rol</label>
          <select id="userRole">
            <option value="tecnico">Técnico</option>
          </select>
        </div>
        <div id="activeGroup" class="form-group" style="display:none">
          <label for="userActive">Estado</label>
          <select id="userActive">
            <option value="true">Activo</option>
            <option value="false">Inactivo</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="modalSubmitBtn">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/users.js"></script>
  <script src="js/effects.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Gestion de Mantenimiento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <div class="bg-decoration" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="speck speck-1"></div>
    
    <div class="speck speck-4"></div>
  </div>

  <div class="app-container" id="appContainer">
    <div class="main-content">
      <div class="page-header">
        <h1>Dashboard</h1>
        <button class="sidebar-theme-btn" data-theme-toggle aria-label="Cambiar a modo oscuro" title="Modo oscuro">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
      <div class="stats-grid" id="statsGrid" data-reveal>
      </div>
      <section class="charts-grid" id="chartsGrid" data-reveal>
        <div class="chart-card">
          <div class="chart-card__header">
            <h3><i class="fa-solid fa-circle-check"></i> Tasa de atención exitosa</h3>
          </div>
          <div class="chart-card__body chart-kpi">
            <canvas id="successRateChart"></canvas>
            <div class="chart-kpi__value" id="successRateValue">0%</div>
          </div>
        </div>
        <div class="chart-card">
          <div class="chart-card__header">
            <h3><i class="fa-solid fa-trophy"></i> Top técnicos</h3>
          </div>
          <div class="chart-card__body">
            <canvas id="topTecnicosChart"></canvas>
          </div>
        </div>
        <div class="chart-card">
          <div class="chart-card__header">
            <h3><i class="fa-solid fa-building"></i> Top clientes</h3>
          </div>
          <div class="chart-card__body">
            <canvas id="topClientesChart"></canvas>
          </div>
        </div>
        <div class="chart-card">
          <div class="chart-card__header">
            <h3><i class="fa-solid fa-list-check"></i> Carga de trabajo por técnico</h3>
          </div>
          <div class="chart-card__body">
            <canvas id="cargaTecnicosChart"></canvas>
          </div>
        </div>
      </section>
      <div class="table-container" data-reveal>
        <table>
          <thead>
            <tr>
              <th>Orden</th>
              <th>Cliente</th>
              <th>Tecnico</th>
              <th>Estado</th>
              <th>Accion</th>
            </tr>
          </thead>
          <tbody id="recentOrders"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/effects.js"></script>
</body>
</html>
